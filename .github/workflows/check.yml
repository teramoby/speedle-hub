name: Site checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Preview checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Run checks
        run: bash scripts/check.sh
